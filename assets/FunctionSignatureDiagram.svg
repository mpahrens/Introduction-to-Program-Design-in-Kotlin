<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="760" viewBox="0 0 2200 760" role="img" aria-labelledby="title desc"><title id="title">Purpose, signature, and stub</title><desc id="desc">Annotated Kotlin shippingCost function with a KDoc purpose, signature components, and a placeholder return statement.</desc><rect width="2200" height="760" fill="#181f27"/><path d="M85 0V760" stroke="#36414d"/><g font-family="Consolas, monospace" font-size="28" fill="#d7e1ea"><text x="60" y="180" text-anchor="end" fill="#7d8d9b">1</text><text x="110" y="180" fill="#9eafbd" font-style="italic">/**</text><text x="60" y="242" text-anchor="end" fill="#7d8d9b">2</text><text x="110" y="242" fill="#9eafbd" font-style="italic"> * Computes the cost to ship one package.</text><text x="60" y="304" text-anchor="end" fill="#7d8d9b">3</text><text x="110" y="304" fill="#9eafbd" font-style="italic"> */</text><text x="60" y="366" text-anchor="end" fill="#7d8d9b">4</text><text x="110" y="366" textLength="954.8000000000001" lengthAdjust="spacingAndGlyphs">fun shippingCost(weightKg: Double, express: Boolean): Double {</text><text x="60" y="428" text-anchor="end" fill="#7d8d9b">5</text><text x="171.6" y="428" textLength="154" lengthAdjust="spacingAndGlyphs">return 0.0</text><text x="60" y="490" text-anchor="end" fill="#7d8d9b">6</text><text x="110" y="490" >}</text></g><rect x="105" y="147" width="710" height="157" rx="5" fill="#58a6ff" fill-opacity="0.09" stroke="#58a6ff" stroke-width="2" /><path d="M815 220 L1145 220 L1470 70" fill="none" stroke="#58a6ff" stroke-width="2"/><circle cx="815" cy="220" r="5" fill="#58a6ff"/><rect x="1470" y="32" width="700" height="80" rx="9" fill="#1e2733" stroke="#58a6ff" stroke-width="2"/><rect x="1470" y="32" width="10" height="80" rx="4" fill="#58a6ff"/><text x="1495" y="64" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#58a6ff">Purpose (KDoc)</text><text x="1495" y="94" font-family="Segoe UI, sans-serif" font-size="22" fill="#c4ced9">Describes what the function computes.</text><rect x="102" y="319" width="1040" height="65" rx="5" fill="#c586ff" fill-opacity="0.09" stroke="#c586ff" stroke-width="2" stroke-dasharray="9 6"/><path d="M1142 322 L1160 322 L1470 171" fill="none" stroke="#c586ff" stroke-width="2"/><circle cx="1142" cy="322" r="5" fill="#c586ff"/><rect x="1470" y="133" width="700" height="80" rx="9" fill="#1e2733" stroke="#c586ff" stroke-width="2"/><rect x="1470" y="133" width="10" height="80" rx="4" fill="#c586ff"/><text x="1495" y="165" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#c586ff">Signature (function header)</text><text x="1495" y="195" font-family="Segoe UI, sans-serif" font-size="22" fill="#c4ced9">Promises the inputs and the result type.</text><rect x="108" y="340" width="50.2" height="39" rx="5" fill="#ff922b" fill-opacity="0.09" stroke="#ff922b" stroke-width="2" /><path d="M135 379 L1175 379 L1470 272" fill="none" stroke="#ff922b" stroke-width="2"/><circle cx="135" cy="379" r="5" fill="#ff922b"/><rect x="1470" y="234" width="700" height="80" rx="9" fill="#1e2733" stroke="#ff922b" stroke-width="2"/><rect x="1470" y="234" width="10" height="80" rx="4" fill="#ff922b"/><text x="1495" y="266" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#ff922b">fun keyword</text><text x="1495" y="296" font-family="Segoe UI, sans-serif" font-size="22" fill="#c4ced9">Introduces a function definition.</text><rect x="169.6" y="340" width="188.8" height="39" rx="5" fill="#18cbbb" fill-opacity="0.09" stroke="#18cbbb" stroke-width="2" /><path d="M275 379 L1190 379 L1470 373" fill="none" stroke="#18cbbb" stroke-width="2"/><circle cx="275" cy="379" r="5" fill="#18cbbb"/><rect x="1470" y="335" width="700" height="80" rx="9" fill="#1e2733" stroke="#18cbbb" stroke-width="2"/><rect x="1470" y="335" width="10" height="80" rx="4" fill="#18cbbb"/><text x="1495" y="367" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#18cbbb">Function name</text><text x="1495" y="397" font-family="Segoe UI, sans-serif" font-size="22" fill="#c4ced9">shippingCost names the computation.</text><rect x="354.4" y="340" width="558.4" height="39" rx="5" fill="#39df79" fill-opacity="0.09" stroke="#39df79" stroke-width="2" /><path d="M615 379 L1205 379 L1470 474" fill="none" stroke="#39df79" stroke-width="2"/><circle cx="615" cy="379" r="5" fill="#39df79"/><rect x="1470" y="436" width="700" height="80" rx="9" fill="#1e2733" stroke="#39df79" stroke-width="2"/><rect x="1470" y="436" width="10" height="80" rx="4" fill="#39df79"/><text x="1495" y="468" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#39df79">Parameter list with types</text><text x="1495" y="498" font-family="Segoe UI, sans-serif" font-size="22" fill="#c4ced9">declares inputs to the function</text><rect x="909.8000000000001" y="340" width="126.2" height="39" rx="5" fill="#ffd400" fill-opacity="0.09" stroke="#ffd400" stroke-width="2" /><path d="M972 379 L1220 379 L1470 575" fill="none" stroke="#ffd400" stroke-width="2"/><circle cx="972" cy="379" r="5" fill="#ffd400"/><rect x="1470" y="537" width="700" height="80" rx="9" fill="#1e2733" stroke="#ffd400" stroke-width="2"/><rect x="1470" y="537" width="10" height="80" rx="4" fill="#ffd400"/><text x="1495" y="569" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#ffd400">Return type</text><text x="1495" y="599" font-family="Segoe UI, sans-serif" font-size="22" fill="#c4ced9">The : Double promises a decimal result.</text><rect x="168.6" y="402" width="160" height="42" rx="5" fill="#2bc1f0" fill-opacity="0.09" stroke="#2bc1f0" stroke-width="2" /><path d="M328.6 425 L1235 425 L1470 676" fill="none" stroke="#2bc1f0" stroke-width="2"/><circle cx="328.6" cy="425" r="5" fill="#2bc1f0"/><rect x="1470" y="638" width="700" height="80" rx="9" fill="#1e2733" stroke="#2bc1f0" stroke-width="2"/><rect x="1470" y="638" width="10" height="80" rx="4" fill="#2bc1f0"/><text x="1495" y="670" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#2bc1f0">Stubbed return statement</text><text x="1495" y="700" font-family="Segoe UI, sans-serif" font-size="22" fill="#c4ced9">return 0.0 supplies a temporary Double value.</text></svg>