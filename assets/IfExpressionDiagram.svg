<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="560" viewBox="0 0 1800 560" role="img" aria-labelledby="title desc"><title id="title">Choose a value with an if expression</title><desc id="desc">The condition age greater than 21 selects adult ticket when true and youth ticket when false. The whole if expression produces the selected String value.</desc><rect width="1800" height="560" fill="#181f27"/><path d="M75 0V560" stroke="#36414d" stroke-width="2"/><rect x="100" y="95" width="560" height="365" rx="5" fill="#39df79" fill-opacity="0.09" stroke="#39df79" stroke-width="2" stroke-dasharray="9 6"/><rect x="175" y="110" width="197" height="48" rx="5" fill="#58a6ff" fill-opacity="0.09" stroke="#58a6ff" stroke-width="2" /><rect x="175" y="185" width="286" height="48" rx="5" fill="#ffd400" fill-opacity="0.09" stroke="#ffd400" stroke-width="2" /><rect x="140" y="260" width="83" height="48" rx="5" fill="#c586ff" fill-opacity="0.09" stroke="#c586ff" stroke-width="2" /><rect x="175" y="335" width="286" height="48" rx="5" fill="#2bc1f0" fill-opacity="0.09" stroke="#2bc1f0" stroke-width="2" /><text x="53" y="145" text-anchor="end" font-family="Consolas, monospace" font-size="32" fill="#7d8d9b">1</text><text x="110" y="145" xml:space="preserve" font-family="Consolas, monospace" font-size="34"><tspan fill="#d8a070">if </tspan><tspan fill="#d7e1ea">(age &gt; 21)</tspan><tspan fill="#d7e1ea"> {</tspan></text><text x="53" y="220" text-anchor="end" font-family="Consolas, monospace" font-size="32" fill="#7d8d9b">2</text><text x="110" y="220" xml:space="preserve" font-family="Consolas, monospace" font-size="34"><tspan fill="#bad786">    "adult ticket"</tspan></text><text x="53" y="295" text-anchor="end" font-family="Consolas, monospace" font-size="32" fill="#7d8d9b">3</text><text x="110" y="295" xml:space="preserve" font-family="Consolas, monospace" font-size="34"><tspan fill="#d7e1ea">} </tspan><tspan fill="#d8a070">else</tspan><tspan fill="#d7e1ea"> {</tspan></text><text x="53" y="370" text-anchor="end" font-family="Consolas, monospace" font-size="32" fill="#7d8d9b">4</text><text x="110" y="370" xml:space="preserve" font-family="Consolas, monospace" font-size="34"><tspan fill="#bad786">    "youth ticket"</tspan></text><text x="53" y="445" text-anchor="end" font-family="Consolas, monospace" font-size="32" fill="#7d8d9b">5</text><text x="110" y="445" xml:space="preserve" font-family="Consolas, monospace" font-size="34"><tspan fill="#d7e1ea">}</tspan></text><path d="M372 114 H740 L990 61" fill="none" stroke="#58a6ff" stroke-width="2"/><circle cx="372" cy="114" r="5" fill="#58a6ff"/><rect x="990" y="20" width="775" height="82" rx="9" fill="#1e2733" stroke="#58a6ff" stroke-width="2"/><rect x="990" y="20" width="10" height="82" rx="4" fill="#58a6ff"/><text x="1015" y="53" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#58a6ff">Boolean condition</text><text x="1015" y="84" font-family="Segoe UI, sans-serif" font-size="23" fill="#c4ced9">Checks whether age is greater than 21.</text><path d="M461 209 H740 L990 167" fill="none" stroke="#ffd400" stroke-width="2"/><circle cx="461" cy="209" r="5" fill="#ffd400"/><rect x="990" y="126" width="775" height="82" rx="9" fill="#1e2733" stroke="#ffd400" stroke-width="2"/><rect x="990" y="126" width="10" height="82" rx="4" fill="#ffd400"/><text x="1015" y="159" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#ffd400">True branch</text><text x="1015" y="190" font-family="Segoe UI, sans-serif" font-size="23" fill="#c4ced9">Produces "adult ticket" when the condition is true.</text><path d="M223 284 H740 L990 273" fill="none" stroke="#c586ff" stroke-width="2"/><circle cx="223" cy="284" r="5" fill="#c586ff"/><rect x="990" y="232" width="775" height="82" rx="9" fill="#1e2733" stroke="#c586ff" stroke-width="2"/><rect x="990" y="232" width="10" height="82" rx="4" fill="#c586ff"/><text x="1015" y="265" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#c586ff">else: the other case</text><text x="1015" y="296" font-family="Segoe UI, sans-serif" font-size="23" fill="#c4ced9">Selects the other branch when the condition is false.</text><path d="M461 359 H740 L990 379" fill="none" stroke="#2bc1f0" stroke-width="2"/><circle cx="461" cy="359" r="5" fill="#2bc1f0"/><rect x="990" y="338" width="775" height="82" rx="9" fill="#1e2733" stroke="#2bc1f0" stroke-width="2"/><rect x="990" y="338" width="10" height="82" rx="4" fill="#2bc1f0"/><text x="1015" y="371" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#2bc1f0">False branch</text><text x="1015" y="402" font-family="Segoe UI, sans-serif" font-size="23" fill="#c4ced9">Produces "youth ticket" when age is 21 or younger.</text><path d="M660 440 H740 L990 485" fill="none" stroke="#39df79" stroke-width="2"/><circle cx="660" cy="440" r="5" fill="#39df79"/><rect x="990" y="444" width="775" height="82" rx="9" fill="#1e2733" stroke="#39df79" stroke-width="2"/><rect x="990" y="444" width="10" height="82" rx="4" fill="#39df79"/><text x="1015" y="477" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#39df79">The whole if expression</text><text x="1015" y="508" font-family="Segoe UI, sans-serif" font-size="23" fill="#c4ced9">Produces one String value from the selected branch.</text></svg>
