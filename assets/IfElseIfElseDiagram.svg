<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc"><title id="title">Choose among three results</title><desc id="desc">Check age greater than 21 first, then age at least 13 only if the first condition is false. Otherwise choose child ticket. One branch produces the String result.</desc><rect width="1800" height="720" fill="#181f27"/><path d="M75 0V720" stroke="#36414d" stroke-width="2"/><rect x="100" y="100" width="580" height="535" rx="5" fill="#39df79" fill-opacity="0.09" stroke="#39df79" stroke-width="2" stroke-dasharray="9 6"/><text x="53" y="145" text-anchor="end" font-family="Consolas, monospace" font-size="32" fill="#7d8d9b">1</text><text x="110" y="145" xml:space="preserve" font-family="Consolas, monospace" font-size="34" fill="#d7e1ea">if (age &gt; 21) {</text><text x="53" y="223" text-anchor="end" font-family="Consolas, monospace" font-size="32" fill="#7d8d9b">2</text><text x="110" y="223" xml:space="preserve" font-family="Consolas, monospace" font-size="34" fill="#bad786">    "adult ticket"</text><text x="53" y="301" text-anchor="end" font-family="Consolas, monospace" font-size="32" fill="#7d8d9b">3</text><text x="110" y="301" xml:space="preserve" font-family="Consolas, monospace" font-size="34" fill="#d7e1ea">} else if (age &gt;= 13) {</text><text x="53" y="379" text-anchor="end" font-family="Consolas, monospace" font-size="32" fill="#7d8d9b">4</text><text x="110" y="379" xml:space="preserve" font-family="Consolas, monospace" font-size="34" fill="#bad786">    "teen ticket"</text><text x="53" y="457" text-anchor="end" font-family="Consolas, monospace" font-size="32" fill="#7d8d9b">5</text><text x="110" y="457" xml:space="preserve" font-family="Consolas, monospace" font-size="34" fill="#d7e1ea">} else {</text><text x="53" y="535" text-anchor="end" font-family="Consolas, monospace" font-size="32" fill="#7d8d9b">6</text><text x="110" y="535" xml:space="preserve" font-family="Consolas, monospace" font-size="34" fill="#bad786">    "child ticket"</text><text x="53" y="613" text-anchor="end" font-family="Consolas, monospace" font-size="32" fill="#7d8d9b">7</text><text x="110" y="613" xml:space="preserve" font-family="Consolas, monospace" font-size="34" fill="#d7e1ea">}</text><rect x="166" y="110" width="210" height="48" rx="5" fill="#58a6ff" fill-opacity="0.09" stroke="#58a6ff" stroke-width="2" /><path d="M376 134 H760 L960 70" fill="none" stroke="#58a6ff" stroke-width="2"/><circle cx="376" cy="134" r="5" fill="#58a6ff"/><rect x="960" y="28" width="805" height="84" rx="9" fill="#1e2733" stroke="#58a6ff" stroke-width="2"/><rect x="960" y="28" width="10" height="84" rx="4" fill="#58a6ff"/><text x="985" y="61" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#58a6ff">1. Check the first condition</text><text x="985" y="93" font-family="Segoe UI, sans-serif" font-size="23" fill="#c4ced9">If age &gt; 21 is true, select "adult ticket".</text><rect x="175" y="188" width="286" height="48" rx="5" fill="#ffd400" fill-opacity="0.09" stroke="#ffd400" stroke-width="2" /><path d="M461 212 H760 L960 182" fill="none" stroke="#ffd400" stroke-width="2"/><circle cx="461" cy="212" r="5" fill="#ffd400"/><rect x="960" y="140" width="805" height="84" rx="9" fill="#1e2733" stroke="#ffd400" stroke-width="2"/><rect x="960" y="140" width="10" height="84" rx="4" fill="#ffd400"/><text x="985" y="173" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#ffd400">First branch wins</text><text x="985" y="205" font-family="Segoe UI, sans-serif" font-size="23" fill="#c4ced9">When selected, skip the remaining conditions and branches.</text><rect x="145" y="266" width="390" height="48" rx="5" fill="#c586ff" fill-opacity="0.09" stroke="#c586ff" stroke-width="2" /><path d="M535 290 H760 L960 294" fill="none" stroke="#c586ff" stroke-width="2"/><circle cx="535" cy="290" r="5" fill="#c586ff"/><rect x="960" y="252" width="805" height="84" rx="9" fill="#1e2733" stroke="#c586ff" stroke-width="2"/><rect x="960" y="252" width="10" height="84" rx="4" fill="#c586ff"/><text x="985" y="285" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#c586ff">2. Otherwise, check the next condition</text><text x="985" y="317" font-family="Segoe UI, sans-serif" font-size="23" fill="#c4ced9">Only if age &gt; 21 is false, check age &gt;= 13.</text><rect x="175" y="344" width="266" height="48" rx="5" fill="#2bc1f0" fill-opacity="0.09" stroke="#2bc1f0" stroke-width="2" /><path d="M441 368 H760 L960 406" fill="none" stroke="#2bc1f0" stroke-width="2"/><circle cx="441" cy="368" r="5" fill="#2bc1f0"/><rect x="960" y="364" width="805" height="84" rx="9" fill="#1e2733" stroke="#2bc1f0" stroke-width="2"/><rect x="960" y="364" width="10" height="84" rx="4" fill="#2bc1f0"/><text x="985" y="397" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#2bc1f0">Second branch</text><text x="985" y="429" font-family="Segoe UI, sans-serif" font-size="23" fill="#c4ced9">Produces "teen ticket" for ages 13 through 21.</text><rect x="140" y="422" width="321" height="126" rx="5" fill="#ff922b" fill-opacity="0.09" stroke="#ff922b" stroke-width="2" /><path d="M461 485 H760 L960 518" fill="none" stroke="#ff922b" stroke-width="2"/><circle cx="461" cy="485" r="5" fill="#ff922b"/><rect x="960" y="476" width="805" height="84" rx="9" fill="#1e2733" stroke="#ff922b" stroke-width="2"/><rect x="960" y="476" width="10" height="84" rx="4" fill="#ff922b"/><text x="985" y="509" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#ff922b">3. Otherwise, use else</text><text x="985" y="541" font-family="Segoe UI, sans-serif" font-size="23" fill="#c4ced9">Produces "child ticket" when both conditions are false.</text><path d="M680 615 H760 L960 630" fill="none" stroke="#39df79" stroke-width="2"/><circle cx="680" cy="615" r="5" fill="#39df79"/><rect x="960" y="588" width="805" height="84" rx="9" fill="#1e2733" stroke="#39df79" stroke-width="2"/><rect x="960" y="588" width="10" height="84" rx="4" fill="#39df79"/><text x="985" y="621" font-family="Segoe UI, sans-serif" font-size="29" font-weight="700" fill="#39df79">One expression, one result</text><text x="985" y="653" font-family="Segoe UI, sans-serif" font-size="23" fill="#c4ced9">Exactly one branch supplies the String value.</text></svg>
